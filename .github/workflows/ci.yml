name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: log_ingestion
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run lint
      run: npx eslint src

    - name: Generate Prisma Client
      run: npx prisma generate
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/log_ingestion

    - name: Run migrations
      run: npx prisma migrate deploy
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/log_ingestion

    - name: Build TypeScript project
      run: npm run build

    - name: Start service in background
      run: npm run start &
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/log_ingestion
        NODE_ENV: production

    - name: Wait for service to be ready
      run: |
        for i in {1..30}; do
          curl -s http://localhost:8080/health && break
          echo "Waiting for app to start..."
          sleep 1
        done

    - name: Run smoke tests
      run: npx tsx src/scripts/smoke-test.ts
