services:

  postgres:
    image: postgres:17
    container_name: log-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: log_ingestion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
        -c shared_buffers=256MB
        -c synchronous_commit=off
        -c wal_buffers=16MB
        -c checkpoint_completion_target=0.9
        -c max_connections=200
        -c effective_cache_size=768MB
        -c work_mem=32MB
        -c max_parallel_workers_per_gather=0
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d log_ingestion"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: log-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/log_ingestion
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

volumes:
  postgres_data:
